<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>評估工作台｜學區道路健檢</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/style.css?v=__BUILD__">
<link rel="stylesheet" href="css/audit.css?v=__BUILD__">
<!-- 與地圖共用同一把金鑰，由部署流程注入 -->
<script>window.__GMAPS_KEY__ = '__GOOGLE_MAPS_KEY__';</script>
</head>
<body class="audit">

<header class="topbar">
  <div class="title">
    <h1>評估工作台</h1>
    <p class="subtitle" id="set-name">載入中…</p>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <span class="unexported" id="unexported" hidden></span>
  <span class="who" id="who" hidden></span>
  <button class="toggle" id="btn-sync" hidden>同步</button>
  <button class="toggle" id="btn-team" hidden>彙總</button>
  <button class="toggle" id="btn-synccfg">同步設定</button>
  <button class="toggle" id="btn-export">匯出</button>
  <button class="toggle" id="btn-import">匯入</button>
  <input type="file" id="file-import" accept="application/json" hidden>
  <a class="toggle" href="index.html">← 地圖</a>
</header>

<dialog id="dlg-sync">
  <form method="dialog" class="dlg-body">
    <h2>同步設定</h2>
    <p class="muted">三項都存在你自己的瀏覽器，不進版本庫。設定方式見
      <code>integrations/google-sheets/README.md</code>。</p>
    <label>你的署名
      <input id="cfg-evaluator" placeholder="例如：王小明" autocomplete="off">
    </label>
    <label>端點網址
      <input id="cfg-endpoint" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    </label>
    <label>TOKEN
      <input id="cfg-token" placeholder="與 Apps Script 中設定的字串相同" autocomplete="off">
    </label>
    <p class="warn">這不是權限控制。端點對任何人開放，TOKEN 只是路障——
      真正的保護是網址不公開。</p>
    <menu>
      <button value="cancel">取消</button>
      <button value="save" id="cfg-save">儲存</button>
    </menu>
  </form>
</dialog>

<dialog id="dlg-team">
  <div class="dlg-body">
    <h2>全體彙總</h2>
    <div id="team-body">載入中…</div>
    <menu>
      <button id="team-close">關閉</button>
    </menu>
  </div>
</dialog>

<div class="progress" id="progress"></div>

<main class="audit-layout">
  <section class="pane pane-pano">
    <header class="pane-head">
      <span id="pano-title">—</span>
      <span class="pano-date" id="pano-date"></span>
      <button class="mini-toggle" id="mini-toggle" aria-pressed="true" aria-controls="mini-map">
        地圖
      </button>
    </header>
    <div id="mini-map" aria-label="所在路段"></div>
    <div id="pano"></div>
    <p class="pano-msg" id="pano-msg" hidden></p>
  </section>

  <section class="pane pane-form">
    <header class="unit-head">
      <div>
        <h2 id="unit-title">—</h2>
        <p class="muted" id="unit-sub"></p>
      </div>
      <span class="unit-status" id="unit-status"></span>
    </header>

    <!-- 開放資料的對應欄位並陳作為對照，但不預填——預填會錨定判讀 -->
    <details class="ref" id="ref" open>
      <summary>開放資料怎麼說</summary>
      <dl id="ref-list"></dl>
      <p class="muted">僅供對照。請依街景自行判讀，不要照抄。</p>
    </details>

    <form id="form"></form>

    <div class="unit-actions">
      <button type="button" id="btn-done">標示完成</button>
      <button type="button" id="btn-noimage">無影像，待補拍</button>
      <button type="button" id="btn-resettime" title="清除此段的計時，作答不動">重設計時</button>
      <span class="timer" id="timer"></span>
    </div>
  </section>
</main>

<nav class="unit-nav">
  <button id="btn-prev">← 上一個</button>
  <select id="unit-picker" aria-label="選擇單位"></select>
  <button id="btn-next">下一個 →</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="js/audit.js?v=__BUILD__"></script>
</body>
</html>
