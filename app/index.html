<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學區道路健檢</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
      crossorigin="anonymous" referrerpolicy="no-referrer">
<!-- ?v= 由部署流程替換為 commit SHA，避免回訪者取到快取的舊版 -->
<link rel="stylesheet" href="css/style.css?v=__BUILD__">
</head>
<body>

<header class="topbar">
  <div class="title">
    <h1 data-i18n="app.title">學區道路健檢</h1>
    <p class="subtitle" data-i18n="app.subtitle">以政府開放資料呈現學校周邊的步行環境</p>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</header>

<div class="filters">
  <div class="filter-row">
    <label class="field"><span class="field-label" data-i18n="filter.county">縣市</span>
      <select id="county"></select>
    </label>
    <fieldset class="field"><legend class="field-label" data-i18n="filter.layers">圖層</legend>
      <div class="chips" id="layers"></div>
    </fieldset>
  </div>
  <div class="filter-row">
    <fieldset class="field"><legend class="field-label" data-i18n="filter.levels">學校類型</legend>
      <div class="chips" id="levels"></div>
    </fieldset>
  </div>
  <div class="filter-row">
    <fieldset class="field"><legend class="field-label" data-i18n="filter.profile">目標人群</legend>
      <div class="chips" id="profile"></div>
    </fieldset>
  </div>
</div>

<div class="summary" id="summary" role="status" aria-live="polite"></div>

<main class="layout">
  <div id="map" role="application" aria-label="地圖"></div>

  <!-- 圖例固定於地圖下側，文字與顏色並用（road-segments spec） -->
  <div class="legend" id="legend">
    <span class="legend-group-label" data-i18n="legend.clearWidth">人行道淨寬</span>
    <span class="legend-item"><i class="sw" style="--c:#D1495B"></i><span data-i18n="legend.lt15">&lt; 1.5 m</span></span>
    <span class="legend-item"><i class="sw" style="--c:#E8A33D"></i><span data-i18n="legend.15to25">1.5 – 2.5 m</span></span>
    <span class="legend-item"><i class="sw" style="--c:#4C9A63"></i><span data-i18n="legend.gte25">&ge; 2.5 m</span></span>
    <span class="legend-item"><i class="road" style="--c:#8A8A8A"></i><span data-i18n="legend.noRecord">查無人行道紀錄</span></span>
    <span class="legend-sep" aria-hidden="true"></span>
    <span class="legend-group-label" data-i18n="legend.schools">學校</span>
    <span class="legend-item"><i class="sch" style="--c:#4E79A7"></i><span>國小</span></span>
    <span class="legend-item"><i class="sch" style="--c:#76B7B2"></i><span>國中</span></span>
    <span class="legend-item"><i class="sch" style="--c:#B07AA1"></i><span>高中職</span></span>
    <span class="legend-item"><i class="sch" style="--c:#3B5BA5"></i><span>大專</span></span>
    <span class="legend-item"><i class="sch" style="--c:#8C6BB1"></i><span>特殊</span></span>
    <span class="legend-item"><i class="sch" style="--c:#9C9C9C"></i><span>其他</span></span>
    <span class="legend-item"><i class="shed"></i><span data-i18n="legend.walkshed">300 m 生活圈</span></span>
    <span class="legend-sep" aria-hidden="true"></span>
    <span class="legend-group-label" data-i18n="legend.crashes">A1 致命事故</span>
    <span class="legend-item"><i class="pt" style="--c:#111111"></i><span>行人</span></span>
    <span class="legend-item"><i class="pt" style="--c:#8C4A2F"></i><span>機車</span></span>
    <span class="legend-item"><i class="pt" style="--c:#B8860B"></i><span>慢車</span></span>
    <span class="legend-item"><i class="pt" style="--c:#35618F"></i><span>汽車、貨車</span></span>
    <span class="legend-item legend-note" data-i18n="legend.crashSize">點徑依死亡人數</span>
  </div>
</main>

<footer class="attribution">
  <span data-i18n="attr.label">資料來源：</span>
  <span>內政部國土管理署「人行道」</span>·
  <span>內政部警政署「傷亡道路交通事故資料」</span>·
  <span>內政部國土測繪中心「各級學校範圍圖」</span>
  <span>內政部國土測繪中心「通用版電子地圖」（底圖）</span>
  <span data-i18n="attr.govLicence">（以上為政府資料開放授權條款第 1 版）</span>·
  <span>&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors (ODbL 1.0)</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="js/main.js?v=__BUILD__"></script>
</body>
</html>
