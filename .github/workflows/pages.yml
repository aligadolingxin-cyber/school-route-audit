name: Deploy to GitHub Pages

# app/ 為網站根目錄。GitHub Pages 的分支部署只支援 / 或 /docs，
# 而 /docs 已用於專案文件，故以 Actions 上傳 app/ 作為 Pages 產物。
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；不中斷進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 以 commit SHA 取代 __BUILD__，使每次部署的 CSS/JS 網址都不同。
      # 沒有這一步，瀏覽器會沿用快取的舊版模組，改動不會生效。
      - name: 注入版本號
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" app/index.html
          grep -c "${GITHUB_SHA::7}" app/index.html
          if grep -q "__BUILD__" app/index.html; then
            echo "仍有未替換的 __BUILD__" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
