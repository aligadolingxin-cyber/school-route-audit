name: Deploy to GitHub Pages

# app/ 為網站根目錄。GitHub Pages 的分支部署只支援 / 或 /docs，
# 而 /docs 已用於專案文件，故以 Actions 上傳 app/ 作為 Pages 產物。
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；不中斷進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 語法錯誤（重複宣告、拼錯的 import）在瀏覽器只會顯示為
      # 整頁空白加一行主控台訊息，且要等部署完才看得到。在這裡擋下。
      - name: 檢查 ES module 語法
        run: |
          fail=0
          for f in app/js/*.js; do
            if node --input-type=module --check < "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f" >&2; fail=1
            fi
          done
          exit $fail

      - uses: actions/configure-pages@v5

      # 以 commit SHA 取代 __BUILD__，使每次部署的 CSS/JS 網址都不同。
      # 沒有這一步，瀏覽器會沿用快取的舊版模組，改動不會生效。
      #
      # 進入點加版本號還不夠：main.js 內部的 import './config.js' 沒有
      # 版本號就仍會取到快取，症狀是「模組沒有匯出某個名稱」的語法錯誤，
      # 而伺服器上的檔案其實是對的。故相對 import 也一併改寫。
      - name: 注入版本號與金鑰
        env:
          GMAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          SHA="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${SHA}/g" app/index.html
          # 未設定 secret 時置換為空字串，前端據此停用街景並說明原因。
          # 此金鑰在前端必然可見，安全性依靠 Google 端的 referrer 限制。
          if [ -n "$GMAPS_KEY" ]; then
            sed -i "s|__GOOGLE_MAPS_KEY__|${GMAPS_KEY}|g" app/index.html
            echo "已注入 Google Maps 金鑰"
          else
            sed -i "s|__GOOGLE_MAPS_KEY__||g" app/index.html
            echo "未設定 GOOGLE_MAPS_API_KEY，街景將停用"
          fi
          sed -i -E "s#(from ['\"]\./[^'\"]+\.js)(['\"])#\1?v=${SHA}\2#g" app/js/*.js
          echo "--- index.html ---"
          grep -o "?v=${SHA}" app/index.html | wc -l
          echo "--- js imports ---"
          grep -ho "?v=${SHA}" app/js/*.js | wc -l
          if grep -q "__BUILD__" app/index.html; then
            echo "仍有未替換的 __BUILD__" >&2; exit 1
          fi
          if grep -qE "from ['\"]\./[^'\"]+\.js['\"]" app/js/*.js; then
            echo "仍有未加版本號的相對 import" >&2
            grep -nE "from ['\"]\./[^'\"]+\.js['\"]" app/js/*.js >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
